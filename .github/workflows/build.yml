name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Myau-VapeStyle-Legit.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - run: chmod +x gradlew
        working-directory: MyauVapeStyle
      - run: ./gradlew build --no-daemon
        working-directory: MyauVapeStyle
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: MyauVapeStyle/build/libs/*.jar
