name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Myau-VapeStyle-Legit.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - run: chmod +x gradlew
        working-directory: MyauVapeStyle
      - name: Build
        shell: bash
        working-directory: MyauVapeStyle
        run: ./gradlew build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 2>&1 | tee build.log
      - name: Show errors
        if: always()
        working-directory: MyauVapeStyle
        run: grep -E -A3 "error:" build.log | head -120 || true
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: MyauVapeStyle/build/libs/*.jar
